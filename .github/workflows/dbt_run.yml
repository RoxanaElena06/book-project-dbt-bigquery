name: dbt scheduled run

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run_dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: book_dbt_bq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install dbt-core dbt-bigquery

      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > /tmp/gcp-sa-key.json

      - name: Set up profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp ../.github/ci_profiles.yml ~/.dbt/profiles.yml

      - run: dbt run
      - run: dbt test